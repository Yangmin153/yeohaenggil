name: STEP 2 unified preview regression
on:
  push:
    branches: [feature/vnext-step2-unified-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Run all itinerary regression tests
        run: npm test
  browser-smoke:
    needs: node-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install browsers for desktop Chromium and mobile WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start local development server
        run: |
          npm run dev > /tmp/step2-dev.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/step2-dev.log
          exit 1
      - name: Test STEP 2 interactions on desktop and iPhone-like WebKit
        run: node scripts/step2-unified-smoke.mjs
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step2-unified-browser-diagnostics
          path: /tmp/step2-*.png
          if-no-files-found: ignore
