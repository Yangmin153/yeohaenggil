name: Visit-order editor browser smoke
on:
  push:
    branches: [design/triple-inspired-b375ee37]
    paths:
      - scripts/visit-order-smoke.mjs
      - .github/workflows/visit-order-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check edit to first place without spending map API calls
        env:
          YG_PREVIEW_URL: https://yeohaenggil-2kqsu0dve-travel-alex.vercel.app
        run: node scripts/visit-order-smoke.mjs
      - name: Upload diagnostic screenshot if failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visit-editor-diagnostic
          path: /tmp/yg-visit-edit-failure.png
          if-no-files-found: ignore
