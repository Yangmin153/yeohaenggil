name: Triple-inspired design preview tests
on:
  push:
    branches: [design/triple-inspired-b375ee37, feature/step2-unified-ux-20261104, feature/step2-place-role-picking-20261104, feature/search-map-hd-layout-v82-20261104, fix/search-picked-hidden-state-v83-20261104]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Run original app regression tests
        run: npm test
