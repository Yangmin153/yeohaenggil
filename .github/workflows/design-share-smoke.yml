name: Share and mobile design browser smoke
on:
  push:
    branches: [design/triple-inspired-b375ee37]
    paths:
      - scripts/design-share-smoke.mjs
      - .github/workflows/design-share-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Open actual Preview and verify sharing + mobile search
        env:
          YG_PREVIEW_URL: https://yeohaenggil-lir84pkqw-travel-alex.vercel.app
        run: node scripts/design-share-smoke.mjs
      - name: Upload error screenshot only on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-smoke-diagnostic
          path: /tmp/yg-design-smoke-error.png
          if-no-files-found: ignore
